<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief Çarkı – Editorial Design Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pastel Butter Yellow Arka Plan */
            --bg: #fffbe6;
            --card: #ffffff;
            --ink: #2c2a29;
            --muted: #787571;
            --line: #f0ebd5;
            --accent-soft: #f7f0cf;
            --primary: #3a3835;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-style: normal;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
        }

        .container {
            max-width: 580px;
            width: 100%;
            margin: auto;
            text-align: center;
        }

        header {
            margin-bottom: 28px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--primary);
            font-style: normal;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 400;
            font-style: normal;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(218, 207, 155, 0.15);
            margin-bottom: 20px;
        }

        .level-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .level-btn {
            background: var(--bg);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-style: normal;
        }

        .level-btn.active, .level-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .brief-output {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        .brief-item {
            border-bottom: 1px dashed var(--line);
            padding-bottom: 12px;
        }

        .brief-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
            font-style: normal;
        }

        .value {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--ink);
            font-style: normal;
        }

        .spin-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            font-family: inherit;
            font-style: normal;
        }

        .spin-btn:hover {
            background: #232220;
        }

        .spin-btn:active {
            transform: scale(0.99);
        }

        /* Alt Bilgi & QR Alanı */
        footer {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .studio-tag {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-style: normal;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 0.3px;
        }

        .qr-code {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background-color: #fff;
            padding: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Brief Çarkı</h1>
            <p class="subtitle">Editorial Design Challenge Generator</p>
        </header>

        <main class="card">
            <div class="level-selector">
                <button class="level-btn active" onclick="setLevel('kolay', this)">Başlangıç</button>
                <button class="level-btn" onclick="setLevel('orta', this)">Orta</button>
                <button class="level-btn" onclick="setLevel('zor', this)">İleri</button>
                <button class="level-btn" onclick="setLevel('eğlenceli', this)">Deneysel</button>
            </div>

            <div class="brief-output">
                <div class="brief-item">
                    <span class="label">Kategori</span>
                    <span class="value" id="category">Çarkı Döndür</span>
                </div>
                <div class="brief-item">
                    <span class="label">Konu / Proje</span>
                    <span class="value" id="topic">Çarkı Döndür</span>
                </div>
                <div class="brief-item">
                    <span class="label">Renk Paleti</span>
                    <span class="value" id="palette">Çarkı Döndür</span>
                </div>
                <div class="brief-item">
                    <span class="label">Tipografi Stil</span>
                    <span class="value" id="typography">Çarkı Döndür</span>
                </div>
                <div class="brief-item">
                    <span class="label">Ekstra Görev</span>
                    <span class="value" id="task">Çarkı Döndür</span>
                </div>
            </div>

            <button class="spin-btn" onclick="generateBrief()">Brief Oluştur</button>
        </main>
    </div>

    <footer>
        <span class="studio-tag">ida.creative.studio</span>
        <!-- Instagram Hesabının QR Kodu -->
        <img class="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://instagram.com/ida.creative.studio" alt="ida.creative.studio Instagram QR">
    </footer>

    <script>
        let currentLevel = 'kolay';

        const data = {
            categories: ["Dergi Mizanpajı", "Kitap Kapağı", "Afiş / Poster", "Tipografik Editoryal", "Katalog / Broşür"],
            topics: {
                kolay: ["Mimarlık Sanatı", "Kahve Kültürü", "Sürdürülebilir Yaşam", "Minimalist İç Mekan"],
                orta: ["Yapay Zeka ve Etik", "Bağımsız Sinema Tarihi", "Kentsel Dönüşüm Belgeseli", "Mikro-Gastronomi"],
                zor: ["Kuantum Fiziğine Giriş", "80'ler Yeraltı Müzik Sahnesi", "Post-Modern Felsefe", "Kripto Ekonomisi"],
                eğlenceli: ["Uzayda Tatil Rehberi", "Kedilerin Gizli Yaşamı", "Sanal Gerçeklik Günlükleri", "Geleceğin Yemekleri"]
            },
            palettes: ["#1a1a1a / #f4f1ea", "#2b4c7e / #d8e2dc", "#4a3b32 / #e8d8c8", "#2d5a27 / #f0ebd8", "#8c2d19 / #f7ede2"],
            typography: ["Classic Serif & Clean Sans", "Modern Editorial Display", "Monospace & Minimalist Serif", "Bold Geometric Sans"],
            tasks: ["Sadece 2 renk kullan", "Grid sistemini kır", "Büyük boy tipografi odaklı ol", "Negatif alanı vurgula"]
        };

        function setLevel(level, btn) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('category').innerText = 'Çarkı Döndür';
            document.getElementById('topic').innerText = 'Çarkı Döndür';
            document.getElementById('palette').innerText = 'Çarkı Döndür';
            document.getElementById('typography').innerText = 'Çarkı Döndür';
            document.getElementById('task').innerText = 'Çarkı Döndür';
        }

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateBrief() {
            document.getElementById('category').innerText = getRandom(data.categories);
            document.getElementById('topic').innerText = getRandom(data.topics[currentLevel]);
            document.getElementById('palette').innerText = getRandom(data.palettes);
            document.getElementById('typography').innerText = getRandom(data.typography);
            document.getElementById('task').innerText = getRandom(data.tasks);
        }
    </script>
</body>
</html>
